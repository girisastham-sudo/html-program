<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="2";text-align:center;>
   <text-align:center;>
        <th colspan="2"> html5form</th>
    <tr>
        <td>Select your favorite color:</td>
           <td> <input type="color" id="favcolor"><br></td>
        </tr>
    <tr>
        <td>birthday:</td>
        <td><input type="date" id="dob"><br></td>
    </tr>
    <tr>
        <td>Enter your email:</td>
        <td><input type="email" id="email"><br></td>    
        <tr>
            <td>birthday(date and time):</td>
            <td><input type="*" id="date and time"><br></td>  
        </tr>
        <tr>
            <td> birthday(monthand year):</td>
            <td><input type="month" id="month"><br></td>
        </tr>
        <tr>
            <td>quantity:</td>
            <td> <select>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>    
            </select><br><br></td>
        </tr>
        <tr>
            <td>points:</td>
            <td><input type="range" id="points"><br></td>
        </tr>
        <tr>
            <td>telephone:</td>
            <td><input type="tel" id="telephone"><br></td>
        </tr>
        <tr>
            <td>add your home page:</td>
            <td><input type="url" id="homepage"><br></td>
        </tr>
    </table>
</body>
</html>
