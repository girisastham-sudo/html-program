<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
<style>
  .calculator {
            width: 300px;
            margin: 50px auto;
            padding:15px;
            border:2px solid black;
            border-radius: 15px;
        }

        .one {
            height: 80px;
            border: 2px solid #999;
            border-radius: 20px;
            font-size: 35px;
            text-align: right;
            padding: 10px;
        }

        button {
            width: 60px;
            height: 55px;
            margin: 3px;
            border: 2px solid #0b0a0a;
            border-radius: 30px;
            background: white;
            font-size: 20px;
            padding:5px 5px 5px 5px;
        }

    </style>
</head>

<body>

<div class="calculator">

    <div class="one" >0</div>

    <br>

    <button>AC</button>
    <button>1</button>

    <button>2</button>
    <button>3</button>
    <button>4</button>
    <button>5</button>

    <button>6</button>
    <button>7</button>
    <button>8</button>
    <button>9</button>

    <button>0</button>
    <button>+</button>
    <button>-</button>
    <button>*</button>

    <button>%</button>
    <button>=</button>

</div>

</body>
</html>
