<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Ordered List</h2>
    <ol>
        <li>apple</li>
        <li>banana</li>
        <li>orange</li>
    </ol>
    <h2>Unordered List</h2>
    <ul>
        <li>car</li>
        <li>bike</li>
        <li>train</li>
    </ul>
    <dl>
        <dt><b>apple</b></dt>
        <dd>A red fruit</dd>
        <dt><b>banana</b></dt>
        <dd>A yellow fruit</dd>
    </dl>
</body>
</html>
